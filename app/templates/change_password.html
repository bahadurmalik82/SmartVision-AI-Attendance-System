{% extends 'base.html' %}
{% block title %}Change password{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-sm border border-slate-200 mt-6">
    <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-slate-900">Change password</h2>
        <p class="text-xs text-slate-500 mt-1">Your new password must be at least 8 characters, with at least one letter and one number.</p>
    </div>
    <form action="{{ url_for('auth.change_password') }}" method="POST" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Current password</label>
            <input type="password" name="current_password" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-iba-blue focus:outline-none">
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">New password</label>
            <input type="password" name="new_password" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-iba-blue focus:outline-none">
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Confirm new password</label>
            <input type="password" name="confirm_password" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-iba-blue focus:outline-none">
        </div>
        <button type="submit" class="btn btn-primary w-full">Change password</button>
        <p class="text-xs text-center text-slate-500 mt-3">
            <a href="{{ url_for('settings.index') }}" class="text-iba-blue font-semibold hover:underline">Back to Settings</a>
        </p>
    </form>
</div>
{% endblock %}
